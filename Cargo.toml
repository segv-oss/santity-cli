[package]
name = "santity"
version = "0.1.0"
edition = "2021"
description = "Native control plane, package manager, and Ratatui TUI dashboard for Santity WebAssembly runtime"
repository = "https://github.com/segv-oss/santity-cli"
license = "MIT OR Apache-2.0"
keywords = ["wasm", "cli", "tui", "discord", "santity"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.38", features = ["full"] }
inquire = "0.7"
toml_edit = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
dirs = "5.0"
libc = "0.2"
which = "6.0"
tui-input = "0.11"
